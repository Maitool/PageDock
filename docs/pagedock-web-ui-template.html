<!doctype html>
<!-- 页坞 PageDock 内置网页程序起步骨架：复制本文件到 samples/你的工具.html，替换内容区即可。
     已内置：双主题变量、首帧主题脚本、字体、开关/分段控件配方、主题握手与 localStorage 命名。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>工具名</title>
<script>
/* 首帧主题：优先用宿主注入的 window.__pdTheme，避免浅色系统先闪一帧深色 */
(function(){try{var t=window.__pdTheme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
:root{color-scheme:light dark;
  --bg:#0B0C0E; --panel:#101216; --card:#131519; --card-hover:#171A1F;
  --text:#E7EAEE; --text-2:#9AA1AB; --text-3:#6B7280;
  --border:#23262D; --border-strong:#2E323B;
  --accent:#D7DCE2; --accent-dim:rgba(255,255,255,.09); --accent-ink:#0B0C0E;
  --danger:#F87171; --danger-bg:rgba(248,113,113,.12);
  --brand:#2DD4BF; /* 品牌青：选中/焦点/点亮 */
  --soft:rgba(255,255,255,.07);
  --shadow-md:0 8px 24px rgba(0,0,0,.35); --shadow-lg:0 24px 64px rgba(0,0,0,.55);
  --sans:"Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;
}
html[data-theme="light"]{color-scheme:light;
  --bg:#F6F7F8; --panel:#FFFFFF; --card:#FFFFFF; --card-hover:#F1F3F5;
  --text:#17191C; --text-2:#565D66; --text-3:#7A828C;
  --border:#E4E7EB; --border-strong:#D3D8DE;
  --accent:#17191C; --accent-dim:rgba(0,0,0,.06); --accent-ink:#FFFFFF;
  --danger:#DC2626; --danger-bg:rgba(220,38,38,.08);
  --brand:#0B8074; --soft:rgba(0,0,0,.05);
  --shadow-md:0 4px 16px rgba(16,24,40,.09); --shadow-lg:0 24px 64px rgba(16,24,40,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased;
  transition:background-color .18s ease,color .18s ease}
::selection{background:var(--accent-dim)}

/* 内容区（替换成你的功能） */
main{flex:1;display:flex;align-items:center;justify-content:center;padding:16px}

/* 常用组件：按钮 */
.btn{height:30px;padding:0 13px;border-radius:9px;border:1px solid var(--border);background:var(--panel);
  color:var(--text);font-size:12.5px;cursor:pointer;transition:background .14s,border-color .14s,color .14s}
.btn:hover{background:var(--card-hover);border-color:var(--border-strong)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:600}
.btn:focus-visible{outline:2px solid var(--text-3);outline-offset:1px}

/* 分段控件 */
.seg{display:inline-flex;background:var(--soft);border-radius:9px;padding:3px;gap:3px}
.seg button{border:none;background:transparent;color:var(--text-2);font-size:12px;font-family:inherit;
  padding:4px 10px;border-radius:6px;cursor:pointer;transition:background .14s,color .14s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}

/* 开关 */
.sw{position:relative;display:inline-block;width:34px;height:19px;flex:none}
.sw input{position:absolute;opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--border);transition:background .15s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
  background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sw input:checked + i{background:var(--brand)}
.sw input:checked + i::after{transform:translateX(15px)}

@media (forced-colors: active){ .btn,.seg,.sw i{border:1px solid CanvasText} }
</style>
</head>
<body>

<main id="content">
  <!-- TODO: 你的界面 -->
  <div class="seg" id="seg-theme">
    <button data-v="auto">跟随页坞</button><button data-v="light">浅色</button><button data-v="dark">深色</button>
  </div>
</main>

<script>
/* 配置：DEFAULTS + localStorage 合并，键按工具名隔离 */
var KEY = 'pagedock-<tool>-settings';
var DEFAULTS = { theme: 'auto' };
var cfg = DEFAULTS;
try { var raw = localStorage.getItem(KEY); if (raw) cfg = Object.assign({}, DEFAULTS, JSON.parse(raw)); } catch (e) {}
function saveCfg(){ try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) {} }

/* 主题：跟随=移除 data-theme（交媒体查询/宿主）；手动=固定 */
function applyTheme(){
  if (cfg.theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', cfg.theme);
}
applyTheme();

/* 分段控件通用接线 */
function wireSeg(id, get, set){
  var seg = document.getElementById(id); if (!seg) return;
  function paint(){ seg.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', b.dataset.v === String(get())); }); }
  seg.addEventListener('click', function(e){ var b = e.target.closest('button'); if (!b) return; set(b.dataset.v); saveCfg(); paint(); });
  paint();
}
wireSeg('seg-theme', function(){ return cfg.theme; }, function(v){ cfg.theme = v; applyTheme(); });
</script>
</body>
</html>
