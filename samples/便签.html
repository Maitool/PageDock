<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>便签</title>
<meta name="app-version" content="0.9.27">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>try{var t=window.__pdTheme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{color-scheme:light dark;
  --bg:#0B0C0E; --panel:#101216; --text:#E7EAEE; --muted:#9AA1AB; --dim:#6B7280;
  --line:#1E2126; --border:#23262D; --border-strong:#2E323B;
  --soft:rgba(255,255,255,.07); --ink:#E7EAEE; --danger:#F87171; --danger-bg:rgba(248,113,113,.12);
  --selbg:rgba(51,144,255,.45)}
@media (prefers-color-scheme: light){
  :root{--bg:#F6F7F8; --panel:#FFFFFF; --text:#17191C; --muted:#565D66; --dim:#7A828C;
    --line:#E4E7EB; --border:#D3D8DE; --border-strong:#C4CBD3;
    --soft:rgba(0,0,0,.05); --ink:#17191C; --danger:#DC2626; --danger-bg:rgba(220,38,38,.08);
    --selbg:rgba(51,144,255,.32)}
}
html[data-theme="light"]{--bg:#F6F7F8;--panel:#FFFFFF;--text:#17191C;--muted:#565D66;--dim:#7A828C;
  --line:#E4E7EB;--border:#D3D8DE;--border-strong:#C4CBD3;
  --soft:rgba(0,0,0,.05);--ink:#17191C;--danger:#DC2626;--danger-bg:rgba(220,38,38,.08);
  --selbg:rgba(51,144,255,.32)}
html[data-theme="dark"]{--bg:#0B0C0E;--panel:#101216;--text:#E7EAEE;--muted:#9AA1AB;--dim:#6B7280;
  --line:#1E2126;--border:#23262D;--border-strong:#2E323B;
  --soft:rgba(255,255,255,.07);--ink:#E7EAEE;--danger:#F87171;--danger-bg:rgba(248,113,113,.12);
  --selbg:rgba(51,144,255,.45)}
html,body{height:100%;margin:0;transition:background .2s,color .2s}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);
  font-family:"Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif}

/* ---- 工具栏（始终单行，溢出用滚轮左右滑） ---- */
#barwrap{position:relative;flex:none}
#bar{display:flex;align-items:center;gap:3px;flex-wrap:nowrap;
  padding:8px 10px;border-bottom:1px solid var(--line);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain}
#bar::-webkit-scrollbar{height:0;width:0}
#bar>*{flex:none} /* 溢出时横向滚动，不挤压控件 */
#bar .tb{
  min-width:26px;height:26px;padding:0 7px;border:none;border-radius:7px;cursor:pointer;
  background:transparent;color:var(--muted);font-size:12.5px;font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;transition:background .12s,color .12s;
  user-select:none;
}
#bar .tb:hover{background:var(--soft);color:var(--text)}
#bar .tb b{font-weight:700}
#bar .tb i{font-style:italic;font-family:Georgia,serif}
#bar .tb s{text-decoration:line-through}
#bar .tb u{text-decoration:underline}
#bar .tb svg{display:block}
#bar .tb.on{background:var(--soft);color:var(--text)}
#bar select.tb{appearance:none;-webkit-appearance:none;padding:0 4px;outline:none;cursor:pointer}
#bar select.tb option{background:var(--panel);color:var(--text)}
#bar input[type=color].tb{width:24px;height:22px;padding:1px 2px;background:transparent;
  border:1px solid var(--border);border-radius:6px;cursor:pointer}
#bar input[type=color].tb:hover{border-color:var(--border-strong)}
.colbtn{position:relative}
.colbtn svg{display:block}
.colbtn input[type=color]{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;border:none;padding:0;margin:0;cursor:pointer}
.lhwrap{position:relative;display:inline-flex;align-items:center;flex:none}
#lh-input,#fs-input{-webkit-appearance:none;-moz-appearance:textfield;appearance:none;padding-right:18px}
#lh-input::-webkit-inner-spin-button,#lh-input::-webkit-outer-spin-button,
#fs-input::-webkit-inner-spin-button,#fs-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.lh-arrow{position:absolute;right:3px;width:16px;height:16px;padding:0;border:none;background:transparent;color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center}
#bar .sp{width:1px;height:16px;background:var(--border-strong);margin:0 3px;flex:none}
#st{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font-size:11.5px;color:var(--muted);
  font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--panel);border:1px solid var(--border);
  border-radius:999px;padding:4px 14px;opacity:0;transition:opacity .35s;pointer-events:none;z-index:90}
#st.show{opacity:1}

/* ---- 编辑区 ---- */
#ed{flex:1;overflow:auto;outline:none;caret-color:var(--ink);
  font-size:14.5px;line-height:1.9;padding:16px 20px;word-break:break-word}
#ed:empty::before{content:attr(data-ph);color:var(--dim);pointer-events:none}
#ed h1{font-size:1.5em;margin:.6em 0 .3em}
#ed h2{font-size:1.28em;margin:.6em 0 .3em}
#ed h3{font-size:1.12em;margin:.6em 0 .3em}
#ed p{margin:.25em 0}
#ed ul,#ed ol{padding-left:1.5em;margin:.35em 0}
#ed blockquote{margin:.5em 0;padding:2px 12px;border-left:3px solid var(--border-strong);
  color:var(--muted);background:var(--soft);border-radius:0 6px 6px 0}
/* 待办勾选框：随内容一起保存，点击在 方/勾 间切换。
   结构性方案：方框绝对定位脱离行盒，块用 padding-left 让文字走正常文本流，
   光标高度与普通文字一致，输入文字必然与方框同一行、垂直居中 */
#ed .todo{position:relative;padding-left:1.6em;min-height:1.9em}
#ed .todo > .ckbox{position:absolute;left:.05em;top:.4em;margin:0}
#ed .ckbox{display:inline-block;position:relative;width:.95em;height:.95em;
  border:.11em solid var(--border-strong);border-radius:.28em;margin-right:.5em;
  vertical-align:baseline;cursor:pointer;user-select:none;transition:background .12s,border-color .12s}
#ed .ckbox:hover{border-color:var(--ink)}
#ed .ckbox.on{background:var(--ink);border-color:var(--ink)}
#ed .ckbox.on::after{content:"";position:absolute;left:.27em;top:.06em;width:.26em;height:.52em;
  border:solid var(--bg);border-width:0 .13em .13em 0;transform:rotate(40deg)}
/* 完成态：整块划线置灰（方框是原子内联盒不受划线影响），再点取消即恢复 */
#ed .todo-done{color:var(--dim);text-decoration:line-through}
#ed div[style*="margin"]{background:transparent}
#ed td.cell-sel{background:rgba(124,142,170,.26)}
@media (prefers-color-scheme: light){#ed td.cell-sel{background:rgba(70,95,140,.18)}}
.selhl{position:fixed;background:var(--selbg);border-radius:1px}
/* 原生选区只保留行为不画颜色：高亮统一由自绘遮罩绘制（聚焦/失焦同一种画法，杜绝切换跳动） */
#ed::selection{background:transparent}
.tipbox{position:fixed;z-index:220;pointer-events:none;display:none;width:max-content;max-width:320px;
  background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:9px;
  padding:5px 10px;font-size:12px;line-height:1.55;text-align:center;
  box-shadow:0 10px 26px rgba(0,0,0,.28)}
.selhl{position:fixed;background:var(--selbg);border-radius:1px}
#ed img{max-width:100%;border-radius:10px;margin:4px 0}
#ed table{border-collapse:collapse;margin:.5em 0}
#ed td,#ed th{border:1px solid var(--border-strong);padding:4px 10px;min-width:44px}
#ed th{font-weight:600;text-align:left}
/* 重复标题行：首行带 .tbl-head 标记（淡底色+加粗），长表/打印时表头逐页跟随 */
#ed tr.tbl-head td,#ed tr.tbl-head th{background:rgba(124,142,170,.13);font-weight:600}
@media (prefers-color-scheme: light){#ed tr.tbl-head td,#ed tr.tbl-head th{background:rgba(70,95,140,.09)}}
/* 框选高亮优先于标题行底色，保证选中态可见 */
#ed tr.tbl-head td.cell-sel,#ed tr.tbl-head th.cell-sel{background:rgba(124,142,170,.26)}
@media (prefers-color-scheme: light){#ed tr.tbl-head td.cell-sel,#ed tr.tbl-head th.cell-sel{background:rgba(70,95,140,.18)}}
@media print{#ed thead{display:table-header-group}#ed tr.tbl-head td,#ed tr.tbl-head th{background:transparent}}

footer{padding:9px 14px;border-top:1px solid var(--line);display:flex;gap:8px;
  justify-content:space-between;align-items:center}
#count{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
#ops{display:flex;gap:8px}
button.act{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:8px;
  padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;transition:color .15s,border-color .15s}
button.act:hover{color:var(--text);border-color:var(--border-strong)}

/* ---- 侧边栏（笔记库） ---- */
#side{position:fixed;left:0;top:0;bottom:0;width:262px;z-index:60;
  background:var(--panel);border-right:1px solid var(--border);box-shadow:14px 0 40px rgba(0,0,0,.25);
  transform:translateX(-108%);visibility:hidden;transition:transform .22s ease, visibility .22s;
  display:flex;flex-direction:column}
body.side-open #side{transform:none;visibility:visible}
/* ---- 小组件模式：平时只有编辑区，工具/统计“按需出现” ---- */
body.widget #bar{display:none}
body.widget #tblgrp{display:none}
body.widget #barmore{display:none}
body.widget #st{display:none}
body.widget > footer{display:none}          /* 导出/复制/清空收进工具面板，不再挤在底部 */
/* 笔记库：小窗里参考手机应用小窗——底部弹层（约七成高、圆角顶边），正文保留在背后仅变暗；
   点弹层外（含暗背板）/ ✕ / Esc 均可关闭，不再整窗遮挡正文 */
body.widget #side{left:0;right:0;top:auto;bottom:0;width:auto;height:min(72%,440px);
  border-right:none;border-top:1px solid var(--border);border-radius:14px 14px 0 0;
  box-shadow:0 -14px 40px rgba(0,0,0,.32);transform:translateY(108%);z-index:88}
body.widget.side-open #side{transform:none}
body.widget .side-back{position:fixed;inset:0;z-index:87;background:rgba(0,0,0,.34);
  opacity:0;pointer-events:none;transition:opacity .22s ease}
body.widget.side-open .side-back{opacity:1;pointer-events:auto}
body.widget #side .head{padding:10px}
body.widget #side .head{display:flex;gap:8px;align-items:center}
body.widget #side .head #q{flex:1 1 auto;min-width:0;width:auto}
body.widget #side .head .sclose{flex:none;width:26px;height:26px;border:none;border-radius:7px;
  background:transparent;color:var(--muted);cursor:pointer;font-size:13px;font-family:inherit}
body.widget #side .head .sclose:hover{background:var(--soft);color:var(--text)}
body.widget.side-open #wbtn{display:none}
body.widget #ed{padding:14px 16px 20px;font-size:14px;line-height:1.85}
/* 悬浮入口：平时不可见，鼠标进窗才淡入半透明；指到按钮/键盘聚焦才全亮 */
body.widget #wbtn{display:flex;left:12px;right:auto;
  opacity:0;pointer-events:none;transition:opacity .18s ease,transform .12s ease}
body.widget:hover #wbtn{opacity:.5;pointer-events:auto}
body.widget #wbtn:hover,body.widget #wbtn:focus-visible{opacity:1}
body.widget #wbtn:focus-visible{outline:2px solid var(--dim);outline-offset:2px}
/* 编辑时出现的极简工具条（B / I / 列表 / 更多），失焦后自动收起 */
#wmini{display:none}
#wmini .tb{min-width:26px;height:28px;padding:0 8px;border:none;border-radius:7px;cursor:pointer;
  background:transparent;color:var(--muted);font-size:12.5px;font-family:inherit;
  display:inline-flex;align-items:center;justify-content:center;transition:background .12s,color .12s;user-select:none}
#wmini .tb:hover{background:var(--soft);color:var(--text)}
#wmini .tb svg{display:block}
body.widget #wmini{display:inline-flex;position:fixed;left:auto;right:8px;top:6px;z-index:84;gap:2px;
  padding:4px 6px;border-radius:10px;border:1px solid var(--border);background:var(--panel);
  box-shadow:0 8px 22px rgba(0,0,0,.18);opacity:0;transform:translateY(-8px);pointer-events:none;
  transition:opacity .15s ease,transform .15s ease}
body.widget.editing #wmini{opacity:1;transform:none;pointer-events:auto}
body.widget.pop-open #wmini{opacity:0;pointer-events:none}  /* 完整面板打开时让位 */
body.widget.pop-open #wbtn{opacity:0;pointer-events:none}   /* 面板自带的“收起”代替悬浮入口 */
body.widget #bar .wclose{margin-left:auto;color:var(--dim)}
body.widget.side-open #wmini{opacity:0;pointer-events:none} /* 笔记库打开时让位 */
/* 完整工具面板：整窗宽浮层（窄窗也能用），分组换行、内部可滚动 */
body.widget #bar.pop{display:flex;position:fixed;left:8px;right:8px;top:8px;width:auto;max-width:none;
  max-height:calc(100% - 16px);overflow-y:auto;overflow-x:hidden;flex-wrap:wrap;gap:4px;padding:8px;
  border:1px solid var(--border);border-radius:12px;background:var(--panel);
  box-shadow:0 14px 36px rgba(0,0,0,.26);z-index:86;scrollbar-width:thin}
body.widget #bar.pop::-webkit-scrollbar{width:8px;height:0}
body.widget #bar.pop .sp{display:none} /* 窄窗里分隔线会打乱换行，改用间距分组 */
/* 小组件只留高频格式；字号/字体/行距/缩进/对齐/表格/符号/取色回主窗口用 */
body.widget #bar #sel-head,body.widget #bar #sel-font,body.widget #bar .lhwrap,
body.widget #bar #btn-indent,body.widget #bar #btn-outdent,
body.widget #bar #btn-fg,body.widget #bar #btn-hl,
body.widget #bar [data-cmd="justifyLeft"],body.widget #bar [data-cmd="justifyCenter"],
body.widget #bar [data-cmd="justifyRight"],
body.widget #bar #btn-table,body.widget #bar #btn-sym{display:none}
/* 面板底部：字符统计一行、三个操作一行（窄窗不横向溢出） */
body.widget #bar .wfoot{display:flex;flex-basis:100%;align-items:center;flex-wrap:wrap;gap:6px;
  padding:8px 0 0;border-top:1px solid var(--line);margin-top:2px}
body.widget #bar .wfoot #count{order:1;flex:1 0 100%;font-size:11px;color:var(--dim);white-space:nowrap}
body.widget #bar .wfoot #ops{order:2;display:flex;gap:6px;flex:1 1 100%;min-width:0}
body.widget #bar .wfoot .act{flex:1 1 0;min-width:0;padding:7px 6px;font-size:11.5px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
@media (forced-colors: active){
  body.widget #wbtn,body.widget #wmini,body.widget #bar.pop{border:1px solid CanvasText}
}
#wbtn{display:none;position:fixed;right:12px;bottom:12px;width:34px;height:34px;border-radius:50%;
  background:var(--panel);border:1px solid var(--border);color:var(--muted);z-index:86;
  align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#wbtn:active{transform:scale(.94)}
#side .head{padding:12px 12px 8px}
#q{width:100%;height:30px;background:var(--bg);border:1px solid var(--border);border-radius:8px;
  color:var(--text);padding:0 10px;font-size:12.5px;outline:none;font-family:inherit;box-sizing:border-box}
#q:focus{border-color:var(--border-strong)}
#list{flex:1;overflow:auto;padding:4px 8px 8px}
.note-item{position:relative;padding:8px 28px 8px 10px;border-radius:9px;cursor:pointer}
.note-item:hover{background:var(--soft)}
.note-item.on{background:var(--soft)}
.note-item .nt{font-size:12.5px;font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-item .nm{font-size:11px;color:var(--dim);margin-top:2px;font-variant-numeric:tabular-nums}
.note-item .del{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:20px;height:20px;border:none;border-radius:6px;background:transparent;color:var(--dim);
  cursor:pointer;display:none;align-items:center;justify-content:center;font-size:12px;font-family:inherit}
.note-item:hover .del{display:flex}
.note-item .del:hover{color:var(--danger);background:var(--danger-bg)}
#side .foot{padding:10px;border-top:1px solid var(--line)}
#new{width:100%;height:32px;border:1px solid var(--border);border-radius:8px;background:transparent;
  color:var(--muted);font-size:12.5px;cursor:pointer;font-family:inherit;transition:color .15s,border-color .15s}
#new:hover{color:var(--text);border-color:var(--border-strong)}
.side-empty{padding:18px 12px;font-size:12px;color:var(--dim);text-align:center}

/* ---- 裁剪弹层 ---- */
.crop-ov{position:fixed;inset:0;z-index:95;background:rgba(5,6,8,.6);
  display:flex;align-items:center;justify-content:center}
.crop-box{background:var(--bg);border:1px solid var(--border-strong);border-radius:12px;
  padding:12px;box-shadow:0 24px 64px rgba(0,0,0,.45);max-width:92vw}
.crop-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;
  font-size:13px;font-weight:600}
.crop-head button{border:none;background:transparent;color:var(--muted);cursor:pointer;
  width:24px;height:24px;border-radius:6px;font-size:13px;font-family:inherit}
.crop-head button:hover{color:var(--text);background:var(--soft)}
#crop-cv{display:block;max-width:76vw;max-height:56vh;cursor:crosshair;border-radius:8px}
.crop-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:10px}
.crop-foot .hint{flex:1;margin:0}
.crop-foot button.act.primary{border-color:var(--border-strong);color:var(--text)}
.crop-foot button.act.primary:hover{background:var(--soft)}
/* 裁剪比例选择 */
.crop-ratio{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.crop-ratio button{border:1px solid var(--border);background:transparent;color:var(--muted);
  border-radius:6px;padding:3px 9px;font-size:11.5px;cursor:pointer;font-family:inherit}
.crop-ratio button:hover{color:var(--text);border-color:var(--border-strong)}
.crop-ratio button.on{color:var(--text);border-color:var(--border-strong);background:var(--soft)}

/* 图片选中缩放层（Word 式 8 向手柄 + 裁剪入口），浮于编辑区之上、不入正文 HTML */
.imgsel{position:fixed;z-index:70;pointer-events:none;outline:1.5px solid var(--border-strong);border-radius:10px}
.imgsel .imh{position:absolute;width:11px;height:11px;background:var(--panel);
  border:1.5px solid var(--border-strong);border-radius:2px;pointer-events:auto;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.imgsel .imh[data-h="nw"]{left:-6px;top:-6px;cursor:nwse-resize}
.imgsel .imh[data-h="n"]{left:calc(50% - 5.5px);top:-6px;cursor:ns-resize}
.imgsel .imh[data-h="ne"]{right:-6px;top:-6px;cursor:nesw-resize}
.imgsel .imh[data-h="e"]{right:-6px;top:calc(50% - 5.5px);cursor:ew-resize}
.imgsel .imh[data-h="se"]{right:-6px;bottom:-6px;cursor:nwse-resize}
.imgsel .imh[data-h="s"]{left:calc(50% - 5.5px);bottom:-6px;cursor:ns-resize}
.imgsel .imh[data-h="sw"]{left:-6px;bottom:-6px;cursor:nesw-resize}
.imgsel .imh[data-h="w"]{left:-6px;top:calc(50% - 5.5px);cursor:ew-resize}
.imgsel .imcrop{position:absolute;left:50%;transform:translateX(-50%);top:-28px;
  pointer-events:auto;border:1px solid var(--border-strong);background:var(--panel);color:var(--muted);
  border-radius:6px;padding:2px 10px;font-size:11.5px;cursor:pointer;font-family:inherit;white-space:nowrap}
.imgsel .imcrop:hover{color:var(--text)}

/* 表格线型可视化按钮 */
.ltbtn{width:26px;height:22px;display:inline-flex;align-items:center;justify-content:center;
  background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;
  color:var(--text);font-size:12px;padding:0}
.ltbtn:hover{border-color:var(--border-strong)}
.ltbtn i{display:block;width:16px}

/* 表格按钮组：接在主工具栏同一行末尾，跟随表格上下文显隐 */
#tblgrp{display:flex;align-items:center;gap:1px;flex:none;padding-left:1px}
#tblgrp.hidden{display:none}
#tblgrp .tbl-label{font-size:11px;color:var(--dim);margin:0 4px 0 1px;letter-spacing:.02em;flex:none}
#tblgrp .tb{width:26px;height:26px;flex:none;padding:0}
#tblgrp .tb svg{display:block}
#tblgrp .tb .caret{width:9px;height:9px;margin-left:-2px;opacity:.65}
#tblgrp .tb[data-dd]{width:32px}
#tblgrp .sp{width:1px;height:16px;background:var(--border-strong);margin:0 4px;flex:none}
#tblgrp .colbtn{position:relative;overflow:hidden}
#tblgrp .colbtn input[type=color]{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;border:none;padding:0;margin:0;cursor:pointer}
#tblgrp .colbtn::after{content:'';position:absolute;left:6px;right:6px;bottom:4px;height:3px;border-radius:2px;
  background:var(--tb-swatch,#FDE68A);pointer-events:none}
/* 右端溢出提示箭头：右侧还有工具时出现，滚到最右自动消失 */
#barmore{position:absolute;right:0;top:0;bottom:1px;width:34px;border:none;padding:0;margin:0;
  display:flex;align-items:center;justify-content:flex-end;cursor:pointer;z-index:5;
  background:linear-gradient(90deg,rgba(0,0,0,0),var(--bg) 58%);color:var(--muted)}
#barmore:hover{color:var(--text)}
#barmore svg{display:block;margin-right:6px}
#barmore.hidden{display:none}

/* 工具条下拉浮层：挂到 body，避免被工具条横向滚动裁切 */
.pdpop{position:fixed;z-index:120;background:var(--bg);border:1px solid var(--border);border-radius:12px;
  padding:10px;box-shadow:0 16px 44px rgba(0,0,0,.28);min-width:168px;max-height:72vh;overflow:auto;
  scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
.pdpop::-webkit-scrollbar{width:6px}
.pdpop::-webkit-scrollbar-track{background:transparent;margin:6px 0}
.pdpop::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px}
.pdpop .prow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pdpop .prow + .prow{margin-top:8px}
.pdpop .lbl{font-size:11.5px;color:var(--dim)}
.pdpop button{height:26px;padding:0 9px;border:1px solid var(--border);border-radius:7px;background:var(--bg);
  color:var(--text);font-size:12px;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.pdpop button:hover{border-color:var(--border-strong);background:var(--soft)}
.pdpop button.on{border-color:var(--border-strong);background:var(--soft);font-weight:600}
.pdpop button.danger:hover{color:var(--danger);border-color:var(--danger)}
.pdpop .pitem{display:flex;width:100%;justify-content:flex-start;border:none;height:30px;padding:0 8px;border-radius:7px}
.pdpop .pitem:hover{background:var(--soft)}
.pdpop .pitem.danger:hover{background:var(--danger-bg);color:var(--danger)}

/* 符号面板：紧贴内容的 8 列网格，消除右侧空白 */
.export-menu.sympop{width:auto;min-width:0;max-height:248px;overflow:auto;padding:7px;display:grid;
  grid-template-columns:repeat(8,26px);grid-auto-rows:26px;gap:2px;justify-content:start;justify-items:center;
  scrollbar-gutter:stable both-edges}
.export-menu.sympop::-webkit-scrollbar{width:6px}
.export-menu.sympop::-webkit-scrollbar-track{background:transparent;margin:6px 0}
.export-menu.sympop::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px;
  border:1px solid transparent;background-clip:content-box}
.export-menu.sympop button{width:26px;height:26px;padding:0;border:none;background:transparent;color:var(--text);
  border-radius:6px;font-size:15px;line-height:1;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;justify-content:center}
.export-menu.sympop button:hover{background:var(--soft)}
.export-menu.sympop button[data-sym]{color:#000}
@media (prefers-color-scheme: light){.export-menu.sympop button[data-sym]{color:#000}}

/* 右键表格面板：只保留合并拆分等不常用项，细圆角滚动条、左右留白对称 */
.tmenu{width:272px;padding:4px 0;flex-direction:column;scrollbar-gutter:stable both-edges}
.export-menu.tmenu::-webkit-scrollbar{width:6px}
.export-menu.tmenu::-webkit-scrollbar-track{background:transparent;margin:6px 0}
.export-menu.tmenu::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px;
  border:1px solid transparent;background-clip:content-box}
.export-menu.tmenu button{width:auto;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);
  background:var(--bg);color:var(--text);border-radius:6px;cursor:pointer;font-family:inherit;font-size:12px;padding:0 8px;height:26px}
.export-menu.tmenu button:hover{border-color:var(--border-strong);background:var(--soft)}
.export-menu.tmenu button.on{border-color:var(--border-strong);background:var(--soft);color:var(--text);font-weight:600}
.export-menu.tmenu .danger:hover{color:var(--danger);border-color:var(--danger)}
.tm-sec{padding:8px 12px;border-top:1px solid var(--line)}
.tm-sec:first-child{border-top:none}
.tm-h{font-size:11px;color:var(--dim);margin-bottom:7px;letter-spacing:.02em}
.tm-row{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.tm-row .lbl{font-size:12px;color:var(--text-2)}
.tm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;width:112px}
.alg{height:30px;padding:5px;flex-direction:column;gap:3px}
.alg i{display:block;height:2px;width:70%;background:var(--muted);border-radius:1px}
.alg[data-v=top]{justify-content:flex-start}
.alg[data-v=mid]{justify-content:center}
.alg[data-v=bot]{justify-content:flex-end}
.alg[data-h=left]{align-items:flex-start}
.alg[data-h=center]{align-items:center}
.alg[data-h=right]{align-items:flex-end}
.alg.on i{background:var(--text)}

/* 导出格式菜单 */
.export-menu{position:fixed;z-index:96;min-width:150px;background:var(--bg);
  border-radius:12px;padding:6px;box-shadow:var(--shadow,0 18px 50px rgba(0,0,0,.3))}
.export-menu::-webkit-scrollbar{width:8px;height:8px}
.export-menu::-webkit-scrollbar-track{background:transparent;margin:6px 0}
.export-menu::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px;
  border:2px solid transparent;background-clip:content-box}
.export-menu button{display:block;width:100%;border:none;background:transparent;color:var(--text);
  font-size:12.5px;padding:8px 12px;border-radius:7px;cursor:pointer;text-align:left;font-family:inherit}
.export-menu button:hover{background:var(--soft)}

/* ---- 取色面板（原生取色浮层没有"确定"，点外面就丢；统一换成带 确定/取消 的面板）---- */
.colpop{position:fixed;z-index:120;width:248px;display:flex;flex-direction:column;gap:9px;
  background:var(--panel);border:1px solid var(--border-strong);border-radius:12px;padding:10px;
  box-shadow:0 18px 50px rgba(0,0,0,.30)}
.colpop .cp-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.colpop .cp-sw{height:20px;border-radius:5px;border:1px solid var(--border);cursor:pointer;padding:0}
.colpop .cp-sw:hover{border-color:var(--border-strong)}
.colpop .cp-sw.on{outline:2px solid var(--text);outline-offset:1px}
.colpop .cp-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.colpop .cp-prev{width:26px;height:26px;border-radius:7px;border:1px solid var(--border-strong);flex:none}
.colpop .cp-hex{width:78px;height:26px;background:var(--bg);border:1px solid var(--border);border-radius:7px;
  color:var(--text);outline:none;font-family:inherit;font-size:12px;padding:0 6px;text-transform:uppercase}
.colpop .cp-hex:focus{border-color:var(--border-strong)}
.colpop .cp-native{position:absolute;width:0;height:0;opacity:0;border:none;padding:0;margin:0;pointer-events:none}
.colpop .cp-foot{display:flex;gap:6px;justify-content:flex-end}
.colpop .cp-foot button{height:26px;padding:0 12px;font-size:12px;border-radius:8px;cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--text);font-family:inherit}
.colpop .cp-foot button:hover{border-color:var(--border-strong);background:var(--soft)}
.colpop .cp-ok{background:var(--ink)!important;color:var(--bg)!important;border-color:transparent!important;font-weight:600}
.colpop .cp-more{margin-left:auto}
</style>
</head>

<script>
var ed = document.getElementById('ed'), st = document.getElementById('st'),
    count = document.getElementById('count'),
    listEl = document.getElementById('list'), qEl = document.getElementById('q');
function setStatus(t){ st.textContent = t; st.classList.add('show'); clearTimeout(st._t); st._t = setTimeout(function(){ st.classList.remove('show'); }, 1600); }

/* 统一风格确认框（替代原生 confirm） */
function askConfirm(msg, cb){
  var ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:300;background:rgba(0,0,0,.4)';
  var m = document.createElement('div');
  m.className = 'export-menu';
  m.style.cssText = 'position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);min-width:230px;max-width:330px;padding:16px 18px;border-radius:14px;gap:0;z-index:301';
  m.innerHTML = '<div class="cf-msg" style="font-size:13px;color:var(--text);line-height:1.7;margin-bottom:16px"></div>' +
    '<div style="display:flex;gap:8px;justify-content:flex-end">' +
    '<button class="act" data-no style="border:1px solid var(--border)">取消</button>' +
    '<button class="act" data-yes style="background:#B4443C;color:#fff;border-color:transparent">确定</button></div>';
  m.querySelector('.cf-msg').textContent = msg;
  document.body.appendChild(ov);
  document.body.appendChild(m);
  function done(yes){ ov.remove(); m.remove(); document.removeEventListener('keydown', esc, true); if (yes) cb(); }
  function esc(e){ if (e.key === 'Escape') { e.stopPropagation(); done(false); } }
  m.querySelector('[data-no]').onclick = function(){ done(false); };
  m.querySelector('[data-yes]').onclick = function(){ done(true); };
  ov.addEventListener('pointerdown', function(){ done(false); });
  m.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
  document.addEventListener('keydown', esc, true);
  m.querySelector('[data-yes]').focus();
}
var KEY = 'pagedock-notes-v2';
var KEY_RICH = 'pagedock-note-rich';   // 旧版单便签（富文本）
var KEY_PLAIN = 'pagedock-note';       // 更早的纯文本

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function toast(msg){
  var t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:52px;left:50%;transform:translateX(-50%);z-index:99;' +
    'background:var(--panel);border:1px solid var(--border-strong);color:var(--text);font-size:12px;' +
    'padding:8px 14px;border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none;';
  document.body.appendChild(t);
  setTimeout(function(){ t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 1500);
  setTimeout(function(){ t.remove(); }, 1900);
}

/* ---- 数据载入与迁移 ---- */
var db = null, curId = null;
(function load(){
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { db = JSON.parse(raw); }
  } catch (e) { db = null; }
  if (!db || !Array.isArray(db.items)) db = { v: 1, items: [] };
  if (!db.items.length) {
    var rich = localStorage.getItem(KEY_RICH);
    var plain = !rich ? localStorage.getItem(KEY_PLAIN) : null;
    var html = '';
    if (rich) html = rich;
    else if (plain) html = plain.split(/\r?\n/).map(function(l){ return '<p>' + (esc(l) || '<br>') + '</p>'; }).join('');
    var now = Date.now();
    db.items.push({ id: uid(), html: html, createdAt: now, updatedAt: now });
    saveAll();
  }
  curId = db.items[0].id;
})();

function saveAll(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); return true; }
  catch (e) { setStatus('保存失败：内容过大（图片太多？）'); return false; }
}
function cur(){ for (var i = 0; i < db.items.length; i++) if (db.items[i].id === curId) return db.items[i]; return db.items[0]; }
function noteTitle(n){
  var d = document.createElement('div'); d.innerHTML = n.html || '';
  // 游离 div 的 innerText 退化成 textContent（块间无换行），故直接走 DOM：
  // 1) 若设了显式标题（h1/h2/h3），只显示该标题本身，不往后拼接正文
  var t = '';
  var h = d.querySelector('h1,h2,h3');
  if (h) t = (h.textContent || '').replace(/\u00a0/g, ' ').trim();
  // 2) 没设标题则取第一段非空块级内容（按段落切，不跨段堆叠）
  if (!t) {
    var kids = d.children;
    for (var i = 0; i < kids.length; i++) {
      var s = (kids[i].textContent || '').replace(/\u00a0/g, ' ').trim();
      if (s) { t = s; break; }
    }
  }
  // 3) 兜底：整段文本的首行
  if (!t) t = (d.textContent || '').replace(/\u00a0/g, ' ').split(/\r?\n/).map(function(x){ return x.trim(); }).filter(Boolean)[0] || '';
  return t.length > 20 ? t.slice(0, 20) + '…' : (t || '新便签');
}
function fmtTime(ts){
  var d = new Date(ts), pad = function(x){ return (x < 10 ? '0' : '') + x; };
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
}

    html += '<div class="note-item' + (n.id === curId ? ' on' : '') + '" data-id="' + n.id + '">' +

function delNote(id){

  if (db.items.length === 1) {

/* 保存编辑器内选区：点颜色/字号/字体控件后恢复，避免选区丢失导致无法应用 */
var savedRange = null;

  var s = getSelection();

  updateIndicators();
  updateSelHl();
});
function restoreRange(){
  ed.focus();
  if (savedRange) {
    var s = getSelection();
    s.removeAllRanges();
    s.addRange(savedRange);
  } else ensureCaret();
}

function ensureCaret(){
  ed.focus();
  var sel = getSelection();
  if (!sel.rangeCount || !ed.contains(sel.anchorNode)) {
    var r = document.createRange();
    r.selectNodeContents(ed);
    r.collapse(false); // 光标不在便签内时落到末尾，保证工具栏任何操作都有落点
    sel.removeAllRanges();
    sel.addRange(r);

}
/* 选区高亮只保留一个绘制者：原生选区已设为透明，聚焦/失焦一律用本遮罩绘制，
   任何焦点切换前后渲染完全一致——这就是此前“点工具栏就跳动”的根治。
   矩形按“行”合并：中英文/字号/行距混排时 getClientRects 会按字形碎片返回多条，
   垂直重叠超过小者 45% 视为同一行；每行取最高碎片的高度统一，再按该行行盒补齐 */
var selHl = document.createElement('div');
selHl.style.cssText = 'position:fixed;z-index:50;pointer-events:none;display:none';
document.body.appendChild(selHl);
function updateSelHl(){
  var r = (savedRange && !savedRange.collapsed && ed.contains(savedRange.commonAncestorContainer)) ? savedRange : null;
  if (!r) { selHl.style.display = 'none'; return; }
  var rects = r.getClientRects(), lines = [];
  for (var i = 0; i < rects.length; i++) {
    var q = rects[i];
    if (q.width < 1 || q.height < 1) continue;
    var L = lines[lines.length - 1];
    if (L) {
      var ov = Math.min(L.bottom, q.bottom) - Math.max(L.top, q.top);
      var mh = Math.min(L.bottom - L.top, q.bottom - q.top);
      if (ov > mh * 0.45) {
        if (q.top < L.top) L.top = q.top;
        if (q.bottom > L.bottom) L.bottom = q.bottom;
        if (q.left < L.left) L.left = q.left;
        if (q.right > L.right) L.right = q.right;
        if (q.height > L.h) { L.h = q.height; L.px = q.left + Math.min(2, q.width / 2); L.my = q.top + q.height / 2; }
        continue;
      }
    }
    lines.push({ top: q.top, bottom: q.bottom, left: q.left, right: q.right,
      h: q.height, px: q.left + Math.min(2, q.width / 2), my: q.top + q.height / 2 });
  }
  var html = '';
  for (var j = 0; j < lines.length; j++) {
    var b = lines[j], h = b.bottom - b.top, w = b.right - b.left;
    if (w < 1 || h < 1) continue;
    var probe = document.elementFromPoint(b.px, b.my);
    if (probe && probe !== selHl && ed.contains(probe)) {
      var cs2 = getComputedStyle(probe);
      var fs2 = parseFloat(cs2.fontSize), lh2 = parseFloat(cs2.lineHeight);
      if (isFinite(fs2) && isFinite(lh2) && lh2 > h) { b.top -= (lh2 - h) / 2; h = lh2; }
    }
    html += '<i class="selhl" style="left:' + b.left + 'px;top:' + b.top + 'px;width:' + w + 'px;height:' + h + 'px"></i>';
  }
  if (!html) { selHl.style.display = 'none'; return; }
  selHl.innerHTML = html;
  selHl.style.display = 'block';
}

/* 自绘工具提示：悬停 [title] 时转为 data-tip 并弹圆角提示框，替代系统原生 title 弹窗 */
var tipBox = document.createElement('div');

    var top = rc.bottom + 6;
    if (top + tipBox.offsetHeight > window.innerHeight - 6) top = rc.top - tipBox.offsetHeight - 6;
    tipBox.style.left = left + 'px';
    tipBox.style.top = top + 'px';
  }, 400);
});

function fillTbPanel(d, kind, td){

    var vv = v === 'middle' ? 'mid' : (v === 'bottom' ? 'bot' : 'top');

function tbWire(d, kind, td){
  d.addEventListener('mousedown', function(e){ if (e.target.closest('button')) e.preventDefault(); });
  d.addEventListener('click', function(e){

      clearCellSel(); caretTo(null); return;
    }

    var bd = b.getAttribute('data-bd');

/* 待办：把当前块转为勾选框条目（再点一次移除方框）；无块时在光标处插入新待办。
   方框本身 contenteditable=false，点击在 方/勾 间切换，状态随内容一起自动保存 */
function makeTodoBox(){
  var b = document.createElement('span');
  b.className = 'ckbox';
  b.setAttribute('contenteditable', 'false');
  return b;
}
function findTodoBlock(n){
  while (n && n !== ed) {
    if (n.nodeType === 1 && /^(P|DIV|H1|H2|H3|LI|BLOCKQUOTE)$/.test(n.tagName)) return n;
    n = n.parentNode;
  }
  return null;
}
document.getElementById('btn-todo').addEventListener('mousedown', function(e){ e.preventDefault(); });
document.getElementById('btn-todo').addEventListener('click', function(){
  restoreRange();
  var s = getSelection();

  if (block) {
    var has = block.querySelector('.ckbox');
    if (has) {
      block.querySelectorAll('.ckbox').forEach(function(x){ x.remove(); });
      block.classList.remove('todo-done');
      block.classList.remove('todo');
      var cr = document.createRange();
      cr.selectNodeContents(block);
      cr.collapse(true);
      s.removeAllRanges(); s.addRange(cr);
      savedRange = cr.cloneRange();
    } else {
      var box = makeTodoBox();
      block.insertBefore(box, block.firstChild);
      block.classList.add('todo');
      block.classList.remove('todo-done');
      // 空块转换后只有方框：补 <br> 撑起行盒，光标才能稳定落在方框右侧同一行
      if (!block.textContent.trim() && !block.querySelector('br')) block.appendChild(document.createElement('br'));
      caretAfterTodoBox(box);
    }
  } else {
    var div = document.createElement('div');
    div.className = 'todo';
    var nb = makeTodoBox();
    div.appendChild(nb);
    div.appendChild(document.createElement('br'));
    if (s.rangeCount) {
      var r0 = s.getRangeAt(0);
      r0.insertNode(div);
    } else ed.appendChild(div);

  }
  ed.dispatchEvent(new Event('input'));

});

function caretAfterTodoBox(box){

/* 缩进/减缩进：完全自实现（Word 式对当前段落 ±40px；列表内保留原生嵌套语义） */
function inListItem(){
  var s = getSelection();
  var n = s.rangeCount ? s.anchorNode : null;
  while (n && n !== ed) { if (n.nodeName === 'LI') return true; n = n.parentNode; }
  return false;
}
function unwrapIndentBlockquotes(){
  ed.querySelectorAll('blockquote:not([data-quote])').forEach(function(bq){
    var div = document.createElement('div');
    var ml = parseInt(bq.style.marginLeft, 10);
    if (!isFinite(ml)) ml = 40;
    div.style.marginLeft = ml + 'px';
    while (bq.firstChild) div.appendChild(bq.firstChild);
    bq.parentNode.replaceChild(div, bq);
  });
}
function selectedTopBlocks(){
  var s = getSelection();
  if (!s.rangeCount) return [];
  var rng = s.getRangeAt(0);
  var root = cellOf(rng.startContainer) || ed;
  function topOf(node, off){
    if (!node) return null;
    if (node.nodeType !== 1) node = node.parentNode;
    if (!node) return null;
    while (node && node.parentNode !== root) node = node.parentNode;
    if (!node || node === root) {
      // 选区锚点恰在根上：用偏移定位直接子节点
      var kids = root.children;
      if (!kids.length) return null;
      node = kids[Math.min(off || 0, kids.length - 1)];
    }
    return node;
  }
  var startOff = rng.startContainer === root ? rng.startOffset : 0;
  var endOff = rng.endContainer === root ? rng.endOffset : 0;
  var node = topOf(rng.startContainer, startOff);
  if (!node) return [];
  var endNode = topOf(rng.endContainer, Math.max(0, endOff - 1));
  if (!endNode) endNode = node;
  var blocks = [], n = node;
  while (n) {
    if (n.nodeType === 1 && n.tagName !== 'BR') blocks.push(n);
    if (n === endNode) break;
    n = n.nextElementSibling;
  }
  return blocks;
}
function indentBlocks(delta){
  var blocks = selectedTopBlocks();
  if (!blocks.length) return;
  blocks.forEach(function(b){
    if (delta > 0) {
      if (b.tagName === 'DIV' && b.style && b.style.marginLeft) {
        b.style.marginLeft = ((parseInt(b.style.marginLeft, 10) || 0) + 40) + 'px';
      } else if (b.tagName !== 'UL' && b.tagName !== 'OL' && b.tagName !== 'TABLE') {
        var div = document.createElement('div');
        div.style.marginLeft = '40px';
        b.parentNode.insertBefore(div, b);
        div.appendChild(b);
      }
    } else {
      var isInd = b.tagName === 'DIV' && b.style && b.style.marginLeft;
      if (isInd || (b.tagName === 'BLOCKQUOTE' && !b.dataset.quote)) {
        var ml = (parseInt(b.style.marginLeft, 10) || 0) - 40;
        if (ml <= 0) {
          var frag = document.createDocumentFragment();
          while (b.firstChild) frag.appendChild(b.firstChild);
          b.parentNode.replaceChild(frag, b);
        } else {
          b.style.marginLeft = ml + 'px';
        }
      }
    }
  });
  ed.dispatchEvent(new Event('input'));
}
function nearestIndentDiv(){
  var s = getSelection();
  var n = s.rangeCount ? s.anchorNode : null;
  while (n && n !== ed) {
    if (n.nodeType === 1 && n.tagName === 'DIV' && n.style && n.style.marginLeft) return n;
    n = n.parentNode;
  }
  return null;
}

var FONT_MAP = { 'microsoft yahei ui': '雅黑', 'microsoft yahei': '雅黑', simsun: '宋体', kaiti: '楷体', simhei: '黑体',

   对不上才把值写进占位项，不再额外塞一个重复的“当前值”条目 */
function syncFontIndicator(fam){
  var sel = document.getElementById('sel-font'), opts = sel.options;
  var short_ = FONT_MAP[fam] || (fam.length > 5 ? fam.slice(0, 5) : fam);
  for (var i = 1; i < opts.length; i++) {
    if (opts[i].textContent === short_ || opts[i].value.toLowerCase() === fam) {
      sel.value = opts[i].value; opts[0].textContent = '字体'; return;

  sel.selectedIndex = 0;
  opts[0].textContent = short_ || '字体';
}

var CP_PAL = [

function cpNorm(v){

function openColorPop(anchor, cur, onOk){

      '<button type="button" class="cp-ok">确定</button></div>';

/* 深度清除：removeFormat 管不到网页粘贴带来的内联 background/color/font 等，这里逐个剥掉（保留对齐/行距等段落属性） */
var FMT_PROPS = ['background','background-color','color','font','font-family','font-size','font-weight','font-style','font-variant','text-decoration','text-decoration-color','letter-spacing','text-transform','text-shadow','-webkit-text-fill-color'];
function stripFmtProps(el){
  FMT_PROPS.forEach(function(p){ el.style.removeProperty(p); });
  if (el.tagName === 'FONT') { el.removeAttribute('face'); el.removeAttribute('color'); el.removeAttribute('size'); }
  if (!el.style.cssText) el.removeAttribute('style');
}
function deepCleanFmt(){
  var s = getSelection();
  if (!s.rangeCount) return;
  var r = s.getRangeAt(0);
  var root = r.commonAncestorContainer;
  if (root.nodeType === 3) root = root.parentNode;
  if (!root || !ed.contains(root)) return;
  if (s.isCollapsed) {
    var n = s.anchorNode;
    while (n && n !== ed) {
      if (n.nodeType === 1 && (n.getAttribute('style') || n.tagName === 'FONT')) { stripFmtProps(n); break; }
      n = n.parentNode;
    }
    return;
  }
  Array.prototype.forEach.call(root.querySelectorAll('*'), function(el){
    if (r.intersectsNode(el) && (el.getAttribute('style') || el.tagName === 'FONT')) stripFmtProps(el);
  });
  [r.startContainer, r.endContainer].forEach(function(n){
    while (n && n !== ed) {
      if (n.nodeType === 1 && (n.getAttribute('style') || n.tagName === 'FONT')) stripFmtProps(n);
      n = n.parentNode;
    }
  });
}

/* 图片：单击选中 → Word 式 8 向拖拽缩放（写内联 width/height，随 HTML 持久化） */
var imgOv = null, ovImg = null;
function positionImgSel(){
  if (!imgOv || !ovImg || !ovImg.isConnected) { clearImgSel(); return; }
  var r = ovImg.getBoundingClientRect();
  // 图片超出窗口时把选择框裁剪到编辑区可视范围内，手柄不会跑到底栏/工具栏上；
  // 缩放按拖拽位移计算，手柄位置被裁剪不影响结果
  var er = ed.getBoundingClientRect();
  var left = Math.max(r.left, er.left), top = Math.max(r.top, er.top);
  var right = Math.min(r.right, er.right), bottom = Math.min(r.bottom, er.bottom);
  if (right - left < 8 || bottom - top < 8) { imgOv.style.display = 'none'; return; }
  imgOv.style.display = '';
  imgOv.style.left = left + 'px'; imgOv.style.top = top + 'px';
  imgOv.style.width = (right - left) + 'px'; imgOv.style.height = (bottom - top) + 'px';
  var cb = imgOv.querySelector('.imcrop');
  if (cb) { if (r.top < 44) { cb.style.top='auto'; cb.style.bottom='-30px'; } else { cb.style.top='-30px'; cb.style.bottom='auto'; } }
}
function clearImgSel(){
  if (imgOv) { imgOv.remove(); imgOv = null; }
  ovImg = null;
  window.removeEventListener('scroll', positionImgSel, true);
  window.removeEventListener('resize', positionImgSel);
}
function showImgSel(img){
  if (ovImg === img && imgOv) { positionImgSel(); return; }
  clearImgSel();
  ovImg = img;
  var ov = document.createElement('div');
  ov.className = 'imgsel';
  ov.innerHTML = ['nw','n','ne','e','se','s','sw','w'].map(function(h){ return '<div class="imh" data-h="'+h+'"></div>'; }).join('') +
    '<button type="button" class="imcrop" title="裁剪图片">裁剪</button>';
  document.body.appendChild(ov);
  imgOv = ov;
  positionImgSel();
  ov.addEventListener('mousedown', function(e){
    if (e.target.classList.contains('imcrop')) { e.preventDefault(); e.stopPropagation(); openCrop(ovImg); return; }
    var h = e.target.getAttribute('data-h');
    if (!h) return;
    e.preventDefault(); e.stopPropagation();
    startImgResize(h, e);
  });
  window.addEventListener('scroll', positionImgSel, true);
  window.addEventListener('resize', positionImgSel);
}
function startImgResize(h, ev){
  var img = ovImg; if (!img) return;
  var r = img.getBoundingClientRect();
  var sw = r.width, sh = r.height, ar = (sh && sw) ? sw/sh : 1;
  var ox = ev.clientX, oy = ev.clientY;
  var right = h.indexOf('e')>=0, left = h.indexOf('w')>=0, bottom = h.indexOf('s')>=0, top = h.indexOf('n')>=0;
  var corner = h.length===2, minS = 20, moved = false;
  function onMove(e){
    var dx = e.clientX - ox, dy = e.clientY - oy;
    if (!moved && (Math.abs(dx)>1 || Math.abs(dy)>1)) moved = true;
    var hd = dx*(right?1:left?-1:0), vd = dy*(bottom?1:top?-1:0);
    var nw = sw, nh = sh;
    var prop = corner ? !e.shiftKey : !!e.shiftKey; // 角默认等比、边默认单向，Shift 反转
    if (prop && ar > 0){
      if (Math.abs(hd) >= Math.abs(vd)) { nw = Math.max(minS, sw+hd); nh = nw/ar; }
      else { nh = Math.max(minS, sh+vd); nw = nh*ar; }
    } else {
      if (right||left) nw = Math.max(minS, sw+hd);
      if (bottom||top) nh = Math.max(minS, sh+vd);
    }
    img.style.width = Math.round(nw)+'px';
    img.style.height = Math.round(nh)+'px';
    positionImgSel();
  }
  function onUp(){
    document.removeEventListener('mousemove', onMove, true);
    document.removeEventListener('mouseup', onUp, true);
    if (moved) ed.dispatchEvent(new Event('input'));
    positionImgSel();
  }
  document.addEventListener('mousemove', onMove, true);
  document.addEventListener('mouseup', onUp, true);
}
/* 单击选中图片；点图片/手柄之外则取消选中 */
document.addEventListener('mousedown', function(e){
  if (imgOv && imgOv.contains(e.target)) return;
  if (e.target && e.target.tagName === 'IMG' && ed.contains(e.target)) { showImgSel(e.target); return; }
  if (imgOv) clearImgSel();
}, true);
function openCrop(img){
  if (!img.naturalWidth) return;
  var ov = document.createElement('div');
  ov.className = 'crop-ov';
  ov.innerHTML = '<div class="crop-box">' +
    '<div class="crop-head"><span>裁剪图片</span><button title="关闭">✕</button></div>' +
    '<canvas></canvas>' +
    '<div class="crop-ratio">' + [
      ['0','自由'],['1','1:1'],['1.3333','4:3'],['0.75','3:4'],['1.5','3:2'],['0.6667','2:3'],
      ['1.7778','16:9'],['0.5625','9:16']
    ].map(function(r){ return '<button data-r="'+r[0]+'">'+r[1]+'</button>'; }).join('') + '</div>' +
    '<div class="crop-foot"><span class="hint" style="font-size:11px;color:var(--dim)">选比例后在图上拖拽；已选区可点比例即时贴合</span>' +
    '<button class="act" data-x>取消</button><button class="act primary" data-ok>应用裁剪</button></div></div>';
  document.body.appendChild(ov);
  var cv = ov.querySelector('canvas'), cx = cv.getContext('2d');
  var maxW = Math.min(560, window.innerWidth * 0.72);
  var maxH = window.innerHeight * 0.56;
  var scale = Math.min(1, maxW / img.naturalWidth, maxH / img.naturalHeight);
  var W = Math.max(80, Math.round(img.naturalWidth * scale));
  var Hh = Math.max(60, Math.round(img.naturalHeight * scale));
  cv.width = W; cv.height = Hh;
  var sel = null, dragging = false, sx = 0, sy = 0, cropRatio = 0;

  function draw(){
    cx.drawImage(img, 0, 0, W, Hh);
    if (sel) {
      cx.fillStyle = 'rgba(0,0,0,.45)';
      cx.fillRect(0, 0, W, Hh);
      // 框内 1:1 还原被选中的原图区域：遮罩只压暗框外，看起来就是一个虚线框
      var inv = 1 / scale;
      cx.drawImage(img, sel.x * inv, sel.y * inv, sel.w * inv, sel.h * inv,
        sel.x, sel.y, sel.w, sel.h);
      cx.strokeStyle = '#fff';
      cx.lineWidth = 1.5;
      cx.setLineDash([5, 4]);
      cx.strokeRect(sel.x + .5, sel.y + .5, sel.w, sel.h);
    }
  }
  function pos(e){
    var r = cv.getBoundingClientRect();
    return { x: Math.max(0, Math.min(W, e.clientX - r.left)),
             y: Math.max(0, Math.min(Hh, e.clientY - r.top)) };
  }
  function applySel(px, py){
    if (cropRatio > 0){
      // 以拖拽起点为锁点，锁定宽高比并夹在画布内
      var w = Math.abs(px - sx), h = w / cropRatio;
      if (sx + w > W) { w = W - sx; h = w / cropRatio; }
      if (sy + h > Hh) { h = Hh - sy; w = h * cropRatio; }
      sel = { x: sx, y: sy, w: Math.max(1, w), h: Math.max(1, h) };
    } else {
      sel.x = Math.min(sx, px); sel.y = Math.min(sy, py);
      sel.w = Math.abs(px - sx); sel.h = Math.abs(py - sy);
    }
  }
  cv.addEventListener('mousedown', function(e){
    var p = pos(e);
    dragging = true; sx = p.x; sy = p.y;
    sel = { x: p.x, y: p.y, w: 1, h: 1 };
    e.preventDefault();
  });
  cv.addEventListener('mousemove', function(e){
    if (!dragging || !sel) return;
    var p = pos(e);
    applySel(p.x, p.y);
    draw();
  });
  document.addEventListener('mouseup', function(){ dragging = false; });
  ov.querySelector('.crop-ratio button').classList.add('on'); // 默认“自由”
  ov.querySelector('.crop-ratio').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    cropRatio = parseFloat(b.dataset.r) || 0;
    Array.prototype.forEach.call(this.querySelectorAll('button'), function(x){ x.classList.toggle('on', x === b); });
    if (sel && cropRatio > 0) { // 已选区即时贴合新比例（以当前锁点为锐角）
      var w = sel.w, h = w / cropRatio;
      if (sel.y + h > Hh) { h = Hh - sel.y; w = h * cropRatio; }
      if (sel.x + w > W) { w = W - sel.x; h = w / cropRatio; }
      sel.w = Math.max(1, w); sel.h = Math.max(1, h);
    }
    draw();
  });
  draw();

  function close(){ ov.remove(); }
  ov.querySelector('.crop-head button').onclick = close;
  ov.querySelector('[data-x]').onclick = close;
  ov.querySelector('[data-ok]').onclick = function(){
    if (!sel || sel.w < 4 || sel.h < 4) { close(); return; }
    var s = 1 / scale;
    var out = document.createElement('canvas');
    out.width = Math.round(sel.w * s);
    out.height = Math.round(sel.h * s);
    out.getContext('2d').drawImage(img,
      sel.x * s, sel.y * s, sel.w * s, sel.h * s, 0, 0, out.width, out.height);
    img.src = out.toDataURL('image/png');
    // 裁剪后清掉旧的拉伸尺寸，正文按裁剪结果的真实宽高比显示
    img.style.removeProperty('width');
    img.style.removeProperty('height');
    img.style.aspectRatio = out.width + ' / ' + out.height;
    ed.dispatchEvent(new Event('input'));
    close();
    toast('已裁剪');
  };
}

  });

  // 编辑时浮出极简条；停止编辑 1.2 秒后收起（鼠标停在条上则保持）
  var miniHide = null;
  function scheduleMiniHide(){
    clearTimeout(miniHide);
    miniHide = setTimeout(function(){
      if (wBar.classList.contains('pop')) return;
      var a = document.activeElement;
      if (wMini.contains(a) || wBar.contains(a)) return;
      document.body.classList.remove('editing');
    }, 1200);
  }
  ed.addEventListener('focus', function(){ document.body.classList.add('editing'); });
  ed.addEventListener('blur', scheduleMiniHide);
  wMini.addEventListener('pointerenter', function(){ clearTimeout(miniHide); });
  wMini.addEventListener('pointerleave', function(){ if (document.activeElement !== ed) scheduleMiniHide(); });

  function wireMini(id, name){
    var b = document.getElementById(id);
    b.addEventListener('mousedown', function(e){ e.preventDefault(); });
    b.addEventListener('click', function(){ cmd(name); });
  }
  wireMini('wmini-b', 'bold');
  wireMini('wmini-i', 'italic');
  wireMini('wmini-ul', 'insertUnorderedList');
  document.getElementById('wmini-lib').onclick = function(){ toggleSide(true); widgetPop(false); };
  document.getElementById('wmini-more').onclick = function(){ widgetPop(true); };

  // Esc 收起面板；点面板外收起
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && wBar.classList.contains('pop')) widgetPop(false);
    if (e.key === 'Escape' && document.body.classList.contains('side-open')) toggleSide(false);
  });
  document.addEventListener('pointerdown', function(e){
    if (!wBar.classList.contains('pop')) return;
    if (wBar.contains(e.target) || wBtn.contains(e.target) || wMini.contains(e.target)) return;
    widgetPop(false);
  }, true);
}
function closeEditorMenu(){
  if (editorMenu) {
    editorMenu.remove(); editorMenu = null;
    document.removeEventListener('pointerdown', onEditorMenuDoc, true);
  }
}
function onEditorMenuDoc(e){ if (editorMenu && !editorMenu.contains(e.target)) closeEditorMenu(); }
function doPaste(){
  return new Promise(function(res){
    if (navigator.clipboard && navigator.clipboard.read) {
      navigator.clipboard.read().then(function(items){
        var chain = Promise.resolve(), done = false;
        items.forEach(function(it){
          if (it.types.indexOf('text/html') >= 0) {
            chain = chain.then(function(){
              return it.getType('text/html').then(function(b){ return b.text(); }).then(function(h){
                ensureCaret(); document.execCommand('insertHTML', false, h); ed.dispatchEvent(new Event('input')); done = true;
              });
            });
          } else if (it.types.indexOf('text/plain') >= 0 && !done) {
            chain = chain.then(function(){
              return it.getType('text/plain').then(function(b){ return b.text(); }).then(function(t){
                ensureCaret(); document.execCommand('insertText', false, t); ed.dispatchEvent(new Event('input')); done = true;
              });
            });
          }
        });
        chain.then(function(){ res(done); }, function(){ res(false); });
      }, function(){ res(false); });
    } else res(false);
  });
}
ed.addEventListener('contextmenu', function(e){
  e.preventDefault();
  closeEditorMenu();
  var img = e.target.closest ? e.target.closest('img') : null;
  var td = e.target.closest ? e.target.closest('td,th') : null;
  var m = document.createElement('div');
  m.className = 'export-menu';
  var html = '';
  if (td) {
    m.className = 'export-menu tmenu';
    // 工具条已覆盖常用设置，右键只留结构性/低频项，避免重复
    html +=
      '<div class="tm-sec"><div class="tm-h">合并与拆分（作用于框选格，未框选则当前格）</div><div class="tm-row">' +
        '<button data-a="merge" title="合并框选的多个单元格">合并单元格</button>' +
        '<button data-a="split" title="拆分当前单元格">拆分单元格</button>' +
        '<button data-a="splittbl" title="从当前行拆分为两个表格">拆分表格</button>' +
      '</div></div>' +
      '<div class="tm-sec"><div class="tm-h">剪贴板</div><div class="tm-row">' +
        '<button data-a="cut">剪切</button><button data-a="copy">复制</button><button data-a="paste">粘贴</button><button data-a="selall">全选</button>' +
      '</div></div>';
  } else {
    if (img) html += '<button data-a="crop">裁剪图片</button><button data-a="delimg">删除图片</button>';
    html += '<button data-a="cut">剪切</button><button data-a="copy">复制</button><button data-a="paste">粘贴</button><button data-a="selall">全选</button>';
  }
  m.innerHTML = html;
  document.body.appendChild(m);
  m.style.left = Math.max(8, Math.min(e.clientX, window.innerWidth - m.offsetWidth - 8)) + 'px';
  m.style.top = Math.max(8, Math.min(e.clientY, window.innerHeight - m.offsetHeight - 8)) + 'px';
  editorMenu = m;
  setTimeout(function(){ document.addEventListener('pointerdown', onEditorMenuDoc, true); }, 0);
  m.addEventListener('click', function(ev){
    var b = ev.target.closest('button');
    if (!b) return;
    var act = b.dataset.a;
    if (act !== 'paste') closeEditorMenu();
    if (act === 'splittbl') clearCellSel();
    if (act === 'crop') { openCrop(img); return; }
    if (act === 'delimg') { img.remove(); ed.dispatchEvent(new Event('input')); return; }
    if (act === 'merge') { tblMerge(td); return; }
    if (act === 'split') { tblSplit(td); caretTo(td); return; }
    if (act === 'splittbl') { tblSplitTable(td); caretTo(td); return; }
    if (act === 'cut') {
      if (getSelection().rangeCount && !getSelection().isCollapsed) { document.execCommand('cut'); ed.dispatchEvent(new Event('input')); }
      else toast('先选中内容');
      return;
    }
    if (act === 'copy') {
      if (getSelection().rangeCount && !getSelection().isCollapsed) document.execCommand('copy');
      else toast('先选中内容');
      return;
    }
    if (act === 'paste') { doPaste().then(function(ok){ if (!ok) toast('请用 Ctrl+V 粘贴'); }); return; }
    if (act === 'selall') {
      var rg = document.createRange(); rg.selectNodeContents(ed);
      var s = getSelection(); s.removeAllRanges(); s.addRange(rg);
    }
  });
});

/* Escape：关裁剪层 / 右键菜单 / 侧边栏 */
document.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  var ov = document.querySelector('.crop-ov');
  if (ov) { ov.remove(); return; }
  if (tbPop) { closeTbPop(); return; }
  if (imgOv) { clearImgSel(); return; }
  if (cellSel.length) { clearCellSel(); return; }
  if (editorMenu) { closeEditorMenu(); return; }
  if (document.body.classList.contains('side-open')) toggleSide(false);
});

  askConfirm('清空当前便签内容？', function(){
    ed.innerHTML = '';
    saveNow();
    setStatus('已清空');
  });
};
document.getElementById('copy').onclick = function(){
  var text = ed.innerText;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ setStatus('已复制'); },
                                            function(){ setStatus('复制失败'); });
  } else {
    var r = document.createRange(); r.selectNodeContents(ed);
    var s = getSelection(); s.removeAllRanges(); s.addRange(r);
    document.execCommand('copy'); s.removeAllRanges();
    setStatus('已复制');
  }
};
/* ---- 导出：txt / markdown / html / word ---- */
function download(name, content, mime){
  var blob = new Blob([content], { type: mime });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
}
function toMarkdown(rootHtml){
  var d = document.createElement('div'); d.innerHTML = rootHtml;
  function walk(node){
    var out = '';
    node.childNodes.forEach(function(n){
      if (n.nodeType === 3) { out += n.textContent.replace(/\u00a0/g, ' '); return; }
      var tag = n.tagName;
      if (tag === 'BR') { out += '\n'; return; }
      var inner = walk(n);
      if (tag === 'H1') out += '\n# ' + inner.trim() + '\n\n';
      else if (tag === 'H2') out += '\n## ' + inner.trim() + '\n\n';
      else if (tag === 'H3') out += '\n### ' + inner.trim() + '\n\n';
      else if (tag === 'P' || tag === 'DIV') out += inner + '\n\n';
      else if (tag === 'UL' || tag === 'OL') {
        var i = 1;
        n.childNodes.forEach(function(li){
          if (li.tagName !== 'LI') return;
          out += (tag === 'UL' ? '- ' : i + '. ') + walk(li).trim() + '\n';
          i++;
        });
        out += '\n';
      }
      else if (tag === 'BLOCKQUOTE')
        out += inner.trim().split('\n').map(function(l){ return '> ' + l; }).join('\n') + '\n\n';
      else if (tag === 'TABLE') {
        n.querySelectorAll('tr').forEach(function(tr, ri){
          var cells = [];
          tr.querySelectorAll('td,th').forEach(function(td){ cells.push(walk(td).trim().replace(/\|/g, '\\|')); });
          out += '| ' + cells.join(' | ') + ' |\n';
          if (ri === 0) out += '|' + Array(cells.length + 1).join(' --- |') + '\n';
        });
        out += '\n';
      }
      else if (tag === 'IMG') out += '\n![图片]()\n';
      else if (tag === 'B' || tag === 'STRONG') out += '**' + inner + '**';
      else if (tag === 'I' || tag === 'EM') out += '*' + inner + '*';
      else if (tag === 'S' || tag === 'STRIKE' || tag === 'DEL') out += '~~' + inner + '~~';
      else if (tag === 'A') out += '[' + inner + '](' + (n.getAttribute('href') || '') + ')';
      else out += inner;
    });
    return out;
  }
  var NL = String.fromCharCode(10);
  return walk(d).replace(new RegExp(NL + '{3,}', 'g'), NL + NL).trim() + NL;
}
function doExport(f){
  var d = new Date();
  var pad = function(n){ return (n < 10 ? '0' : '') + n; };
  var base = '便签-' + noteTitle(cur()).replace(/[\\/:*?"<>|]/g, '') + '-' +
             d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
  if (f === 'txt') download(base + '.txt', ed.innerText, 'text/plain;charset=utf-8');
  else if (f === 'md') download(base + '.md', toMarkdown(ed.innerHTML), 'text/markdown;charset=utf-8');
  else if (f === 'html') download(base + '.html',
      '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>' + esc(noteTitle(cur())) + '</title>' +
      '<style>body{font-family:"Microsoft YaHei UI",sans-serif;max-width:760px;margin:32px auto;padding:0 16px;line-height:1.9;color:#222}' +
      'blockquote{border-left:3px solid #ccc;margin:.5em 0;padding:2px 12px;color:#555}table{border-collapse:collapse}' +
      'td{border:1px solid #bbb;padding:4px 10px}img{max-width:100%}</style></head><body>' + ed.innerHTML + '</body></html>',
      'text/html;charset=utf-8');
  else if (f === 'doc') download(base + '.doc',
      '<html xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8">' +
      '<style>body{font-family:"Microsoft YaHei UI",sans-serif;font-size:12pt;line-height:1.7}' +
      'table{border-collapse:collapse}td{border:1px solid #888;padding:4px 10px}</style>' +
      '</head><body>' + ed.innerHTML + '</body></html>', 'application/msword');
  setStatus('已导出 ' + f.toUpperCase());
}
document.getElementById('btn-export').addEventListener('click', function(){
  var old = document.querySelector('.export-menu');
  if (old) { old.remove(); return; }
  var m = document.createElement('div');
  m.className = 'export-menu';
  m.innerHTML = '<button data-f="txt">纯文本 .txt</button>' +
    '<button data-f="md">Markdown .md</button>' +
    '<button data-f="html">网页 .html</button>' +
    '<button data-f="doc">Word .doc</button>';
  document.body.appendChild(m);
  var r = this.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(r.left, window.innerWidth - m.offsetWidth - 8)) + 'px';
  m.style.top = Math.max(8, r.top - m.offsetHeight - 6) + 'px';
  var close = function(){ m.remove(); document.removeEventListener('pointerdown', onDoc, true); };
  var onDoc = function(e){ if (!m.contains(e.target)) close(); };
  setTimeout(function(){ document.addEventListener('pointerdown', onDoc, true); }, 0);
  m.addEventListener('click', function(e){
    var b = e.target.closest('button');
    if (!b) return;
    var f = b.dataset.f;
    close();
    doExport(f);
  });
});
